name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # The em dash is banned in this repository; see CLAUDE.md.
      - name: No em dash
        run: |
          if git grep -In $'\xe2\x80\x94' -- .; then
            echo "::error::U+2014 found; use a comma, a colon or a full stop"
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      # The maths behind the components is pinned to upstream's own numbers; a failure
      # here means the port has drifted. See docs/fidelity.md.
      - name: Test
        run: swift test

      - name: Fail on warnings
        run: |
          rm -rf .build
          swift build --build-tests 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "::error::the build emitted warnings"
            grep "warning:" build.log
            exit 1
          fi

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftformat swiftlint
      - run: swiftformat --lint .
      - run: swiftlint lint --strict

  showcase:
    name: Showcase app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Generate the project
        working-directory: Showcase
        run: xcodegen generate
      # This is also the only build that compiles the Metal shader: the command line
      # package build copies it rather than compiling it. See docs/fidelity.md.
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project Showcase/RareUIShowcase.xcodeproj \
            -scheme RareUIShowcase \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
