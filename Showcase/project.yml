name: RareUIShowcase
options:
  bundleIdPrefix: io.github.dim971.rareui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RareUI:
    path: ..

targets:
  RareUIShowcase:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: RareUI
        product: RareUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Rare UI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dim971.rareui.showcase
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
